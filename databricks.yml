# This is a Declarative Automation Bundle definition for databricks-test.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: databricks-webpage-classifier

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-6999e735-3607.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-6999e735-3607.cloud.databricks.com

resources:
  jobs:
    webpage_classifier:
      name: webpage-classifier-pipeline
      # No schedule: run on demand only, e.g.
      #   databricks bundle run webpage_classifier -t dev

      # Serverless job environment: tasks run on serverless compute with
      # these packages available.
      environments:
        - environment_key: ml
          spec:
            environment_version: "2"
            dependencies:
              - scikit-learn==1.9.1
              - joblib==1.6.0

      tasks:
        - task_key: ingest
          environment_key: ml
          spark_python_task:
            python_file: ./pipelines/ingest.py
            parameters: ["/Volumes/workspace/bronze/raw"]

        - task_key: clean
          depends_on:
            - task_key: ingest
          environment_key: ml
          spark_python_task:
            python_file: ./pipelines/clean.py

        - task_key: prepare
          depends_on:
            - task_key: clean
          environment_key: ml
          spark_python_task:
            python_file: ./pipelines/prepare.py

        - task_key: train
          depends_on:
            - task_key: prepare
          environment_key: ml
          spark_python_task:
            python_file: ./training/train.py
            parameters: ["/Volumes/workspace/gold/artifacts"]

        - task_key: export
          depends_on:
            - task_key: train
          environment_key: ml
          spark_python_task:
            python_file: ./training/export.py
            parameters: ["/Volumes/workspace/gold/artifacts"]
